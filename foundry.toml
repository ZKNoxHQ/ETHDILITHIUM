[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
# runs high enough that the optimizer keeps the packed kernels' 32-byte lane
# constants as PUSH32: at 10000 it CODECOPYs the most frequent one (102
# occurrences) from the data section at every use, +95k gas per verify
optimizer_runs = 1000000
# the packed kernels are ~20% cheaper under the IR pipeline (stack layout)
via_ir = true
solc_version = "0.8.30"
evm_version = "osaka"
ffi = true
# test/KAT: NIST vectors read by test/dilithium65_vectors.t.sol
fs_permissions = [{ access = "read", path = "./test/KAT" }]

[profile.lite]
optimizer = false
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# All 100 vectors of PQCsignKAT_Dilithium3.rsp at once (make test_kat100). Each
# vector carries its 38,112-byte expanded key, so the vectors file reaches about
# 10.7 MB and one test call expands EVM memory far past the defaults: the
# default gas limit of 2**30 is hit by memory expansion alone and reported as
# MemoryOOG.
[profile.kat100]
gas_limit = 9223372036854775807
memory_limit = 8589934592
